<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="衣序 · 私人数字衣柜。整理衣物，发现每日搭配。数据保存在你的浏览器。">
  <title>衣序 — 私人衣柜与日常搭配</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <button class="mobile-menu icon-button" id="mobile-menu" aria-label="打开导航"></button>
  <div class="sidebar-shade" id="sidebar-shade"></div>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home" aria-label="衣序首页"><span class="brand-symbol" id="brand-symbol"></span><span class="brand-title">衣序<span>THE EVERYDAY WARDROBE</span></span></a>
    <div class="workspace-label">我的私人衣橱 <span class="small-dot"></span></div>
    <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>
    <div class="sidebar-section-label">衣物分类<button class="icon-button" id="manage-categories" title="管理分类" aria-label="管理分类"></button></div>
    <nav class="category-nav" id="category-nav" aria-label="衣物分类"></nav>
    <div class="sidebar-bottom"><div class="local-status"><span class="small-dot"></span><span id="storage-state">已保存在此浏览器</span></div><button class="profile-button" id="profile-button"><span class="avatar">衣</span><span>属于自己的风格<small>从好好整理开始</small></span></button></div>
  </aside>
  <main class="main" id="main"><div id="app"></div><footer class="app-footer"><span>少一点犹豫，多一点喜欢。</span><span>衣序 · YOUR STYLE, IN ORDER</span></footer></main>
  <div class="modal-root" id="modal-root"></div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
</body>
</html>
